# =============================================================================
# Church Admin - Build and Deploy (Optimized)
# =============================================================================
# Comprehensive CI/CD workflow with tests, linting, type checking, and deployment
#
# Features:
#   - TypeScript type checking
#   - ESLint linting
#   - Build verification
#   - Docker build and push
#   - Kubernetes deployment
#   - Aggressive caching for faster builds
# =============================================================================

name: Build and Deploy to DigitalOcean Kubernetes

on:
  push:
    branches:
      - main
      - staging
      - 'security/**'
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tailwind.config.js'
      - 'tsconfig*.json'
      - 'Dockerfile'
      - '.github/workflows/deploy.yml'

  pull_request:
    branches:
      - main
      - staging

  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip tests'
        type: boolean
        default: false
      skip_deploy:
        description: 'Skip deployment (build only)'
        type: boolean
        default: false

env:
  REGISTRY: registry.digitalocean.com
  IMAGE_NAME: soapbox-registry/church-admin
  CLUSTER_NAME: soapbox-production

concurrency:
  group: church-admin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ===========================================================================
  # Test & Lint (runs in parallel with build)
  # ===========================================================================
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.skip_tests != 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: TypeScript type check
        run: npx tsc -b --noEmit || npx tsc --noEmit

      - name: Run ESLint
        run: npm run lint

      - name: Build check
        run: npm run build
        env:
          VITE_API_URL: https://app.soapboxsuperapp.com

      - name: Test Summary
        if: always()
        run: |
          echo "## Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- TypeScript: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- ESLint: Passed" >> $GITHUB_STEP_SUMMARY
          echo "- Build: Verified" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Build Docker Image
  # ===========================================================================
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: [test]
    if: ${{ always() && (needs.test.result == 'success' || needs.test.result == 'skipped') && github.event_name != 'pull_request' }}
    outputs:
      image_tag: ${{ steps.vars.outputs.short_sha }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set variables
        id: vars
        run: echo "short_sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      - name: Build and Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache,mode=max
          build-args: |
            VITE_API_URL=https://app.soapboxsuperapp.com

      - name: Summary
        run: |
          echo "## Build Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ===========================================================================
  # Deploy to Kubernetes
  # ===========================================================================
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: ${{ github.event.inputs.skip_deploy != 'true' && needs.build-and-push.result == 'success' }}
    env:
      NAMESPACE: ${{ github.ref == 'refs/heads/main' && 'soapbox' || 'soapbox-staging' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig
        run: doctl kubernetes cluster kubeconfig save ${{ env.CLUSTER_NAME }} --expiry-seconds 600

      - name: Deploy to Kubernetes
        run: |
          # Apply the k8s manifests (creates or updates resources)
          kubectl apply -f k8s/deployment.yaml
          kubectl apply -f k8s/ingress.yaml

          # Update the deployment with the new image tag
          kubectl set image deployment/church-admin \
            church-admin=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.build-and-push.outputs.image_tag }} \
            -n ${{ env.NAMESPACE }}

      - name: Wait for rollout
        run: kubectl rollout status deployment/church-admin -n ${{ env.NAMESPACE }} --timeout=300s

      - name: Verify deployment
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "**Namespace:** ${{ env.NAMESPACE }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** \`church-admin:${{ needs.build-and-push.outputs.image_tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Pods" >> $GITHUB_STEP_SUMMARY
          kubectl get pods -n ${{ env.NAMESPACE }} -l app=church-admin >> $GITHUB_STEP_SUMMARY
